name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # la regresión con red solo corre a mano: las APIs limitan por IP

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verificar_bib.py --selftest

  regresion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tests/regresion.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
